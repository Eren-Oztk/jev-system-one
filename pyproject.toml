[project]
name = "systemone"
version = "0.1.0"
description = "TypeSafe System One (Jev) karar katmanı: tipli kararlar, kalibre olasılıklar, eşik yönetimi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "typesafe-sdk>=0.7.1",
  "system-one-adapter[openai]>=0.2.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8"]

[project.scripts]
jev = "systemone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["systemone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
